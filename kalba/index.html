<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f8f6f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalbėk!">
<title>Kalbėk! – anglų kalba su AI mokytoja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back hidden" id="back" aria-label="Atgal"><svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg></button>
    <h1 id="title" class="wordmark">kalbėk<span>!</span></h1>
    <span class="chip honey" id="streak" title="Dienų serija"><svg class="icon" aria-hidden="true"><use href="#i-flame"></use></svg><span>0</span></span>
    <span class="chip" id="xp" title="Patirties taškai"><svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg><span>0</span></span>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Pagrindinis meniu">
    <div class="tabbar-inner">
      <button data-tab="path"><svg class="icon" aria-hidden="true"><use href="#i-path"></use></svg>Pamokos</button>
      <button data-tab="stats"><svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg>Pažanga</button>
      <button data-tab="settings"><svg class="icon" aria-hidden="true"><use href="#i-gear"></use></svg>Nustatymai</button>
    </div>
  </nav>
</div>
<div id="modal-root"></div>
<div id="icon-sprite"></div>

<!-- Kursas: lygių ir skyrių sąrašas; skyrių failus įkelia js/app.js. -->
<script src="curriculum/course.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
