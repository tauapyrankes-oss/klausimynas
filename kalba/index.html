<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5b4fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalbėk!">
<title>Kalbėk! – anglų kalba su AI mokytoja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back hidden" id="back" aria-label="Atgal">←</button>
    <h1 id="title">Kalbėk!</h1>
    <span class="chip" id="streak" title="Dienų serija">🔥 0</span>
    <span class="chip" id="xp" title="Patirties taškai">⭐ 0</span>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Pagrindinis meniu">
    <div class="tabbar-inner">
      <button data-tab="path"><span class="ico">🗺️</span>Pamokos</button>
      <button data-tab="talk"><span class="ico">💬</span>Pokalbis</button>
      <button data-tab="stats"><span class="ico">📈</span>Pažanga</button>
      <button data-tab="settings"><span class="ico">⚙️</span>Nustatymai</button>
    </div>
  </nav>
</div>
<div id="modal-root"></div>

<!-- Kursas: lygių ir skyrių sąrašas; skyrių failus įkelia js/app.js. -->
<script src="curriculum/course.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
