<!doctype html><html lang="lt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ema — išteklių peržiūra</title><style>body{font-family:system-ui;margin:0;color:#302743;background:#f6f5fb}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:30px}p{color:#665c78;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:25px 16px;border-radius:18px;margin:16px 0}.dark{background:#14131c;color:#f6f5fb}.cell{text-align:center}.cell img{display:block;width:128px;height:128px;margin:auto}.cell span{font-size:12px}.sizes{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:12px}.sizes img:first-child{width:48px;height:48px}.sizes img:last-child{width:96px;height:96px}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.levels img{width:100%}.icons{display:flex;align-items:center;gap:20px}.icons img{width:90px;height:90px}audio{max-width:100%}.sound-list{display:flex;flex-wrap:wrap;gap:20px}a{color:#5b4fd6}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style><main><h1>Ema · Kalbėk!</h1><p>Septynios tos pačios mokytojos būsenos. Įjungus sistemos „Sumažinti judėjimą“, animacijos sustoja.</p><div id="light" class="grid"></div><div id="dark" class="grid dark"></div><h2>Lygių iliustracijos</h2><div class="levels"><img src="../assets/levels/a1plus.svg" alt="Kavinė"><img src="../assets/levels/a2.svg" alt="Kelionė traukiniu"><img src="../assets/levels/a2plus.svg" alt="Draugų pokalbis"><img src="../assets/levels/b1.svg" alt="Diskusija"></div><h2>Ikona</h2><div class="icons"><img src="../icons/icon-512.png" alt="Kalbėk! ikona"><img src="../icons/icon-192.png" alt="Mažesnė ikona"></div><h2>Garso efektai</h2><p>Iliustracijos ir garsai paruošti; esamoje programėlėje dar neprijungti. Ema ir ikona įkeliamos automatiškai.</p><div class="sound-list"><label>Teisingai<br><audio controls preload="none" src="../assets/sfx/correct.mp3"></audio></label><label>Dar kartą<br><audio controls preload="none" src="../assets/sfx/wrong.mp3"></audio></label><label>Naujas lygis<br><audio controls preload="none" src="../assets/sfx/levelup.mp3"></audio></label></div><p><a href="../index.html">Atverti programėlę</a></p></main><script>const states={idle:'Rami',wave:'Mojuoja',listening:'Klausosi',talking:'Kalba',thinking:'Galvoja',happy:'Džiaugiasi',encourage:'Padrąsina'};for(const id of ['light','dark'])document.getElementById(id).innerHTML=Object.entries(states).map(([s,label])=>`<div class="cell"><img src="../assets/ema/${s}.svg" alt="Ema: ${label}"><span>${label}</span><div class="sizes"><img src="../assets/ema/${s}.svg" alt="48 px"><img src="../assets/ema/${s}.svg" alt="96 px"></div></div>`).join('');</script></html>
