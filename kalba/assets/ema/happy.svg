<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title"><title id="title">Ema džiaugiasi</title><style>
svg{overflow:visible}.head{transform-origin:256px 332px}.eyes{transform-box:fill-box;transform-origin:center}.blink{animation:blink 5.8s linear infinite}.wave-arm{transform-origin:360px 364px;animation:wave 1.9s cubic-bezier(.45,0,.25,1) infinite}.listen-head{animation:nod 2.2s cubic-bezier(.45,0,.25,1) infinite}.talk-mouth{transform-origin:256px 297px;animation:talk .65s cubic-bezier(.45,0,.25,1) infinite}.talk-hand{transform-origin:364px 397px;animation:gesture 1.9s cubic-bezier(.45,0,.25,1) infinite}.think-dot{animation:think 1.8s linear infinite}.think-dot.d2{animation-delay:-1.2s}.think-dot.d3{animation-delay:-.6s}.happy-arm-r{transform-origin:354px 359px;animation:cheer-r 1.7s cubic-bezier(.45,0,.25,1) infinite}.happy-arm-l{transform-origin:157px 359px;animation:cheer-l 1.7s cubic-bezier(.45,0,.25,1) infinite}.confetti{animation:confetti 2s cubic-bezier(.2,.7,.35,1) infinite;transform-origin:center}.encourage-hand{transform-origin:364px 390px;animation:encourage 2.2s cubic-bezier(.45,0,.25,1) infinite}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.09)}}
@keyframes wave{0%,12%,100%{transform:rotate(0deg)}30%,66%{transform:rotate(12deg)}48%,82%{transform:rotate(-8deg)}}
@keyframes nod{0%,100%{transform:rotate(-7deg)}45%{transform:rotate(-3deg) translateY(3px)}}
@keyframes talk{0%,100%{transform:scaleY(.45)}25%,72%{transform:scaleY(1)}50%{transform:scaleY(.25)}}
@keyframes gesture{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
@keyframes think{0%,100%{opacity:.35}45%,65%{opacity:1}}
@keyframes cheer-r{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-6deg)}}
@keyframes cheer-l{0%,100%{transform:rotate(0deg)}45%{transform:rotate(6deg)}}
@keyframes confetti{0%,100%{transform:translateY(-3px);opacity:.4}50%{transform:translateY(7px);opacity:1}}
@keyframes encourage{0%,100%{transform:translateY(0)}42%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
