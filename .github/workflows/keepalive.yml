name: Supabase keepalive
# The free Supabase project pauses after a week without requests; this ping
# keeps it awake so the questionnaire can always submit answers.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: >
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping"
          -H "apikey: $SUPABASE_ANON_KEY"
          -H "Content-Type: application/json" -d '{}'
        env:
          SUPABASE_URL: https://duliyhqdnagjvbfnszyk.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_C71UAo3vobvqt558tzKvmQ_2IizOTFs
